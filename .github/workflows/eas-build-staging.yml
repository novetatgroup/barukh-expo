name: EAS Build - Staging

# Fires whenever `staging` gets new commits (i.e. a PR merge into staging).
# Kicks off an Android build on EAS using the "preview" profile and returns
# immediately - check expo.dev for build status/the resulting APK link.
on:
  push:
    branches:
      - staging

jobs:
  build-android-preview:
    name: Build Android (preview)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v9
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Trigger EAS Build (Android, preview profile)
        run: eas build --platform android --profile preview --non-interactive --no-wait
